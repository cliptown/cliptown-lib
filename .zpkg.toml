[package]
org = "cliptown"
name = "cliptown-lib"
version = "0.1.0"
description = "Shared Rust domain logic, authorization policy, privacy validation, deterministic sync, and retry policy for ClipTown"
license = "MIT"
keywords = ["clipboard", "rust", "sdk", "sync", "privacy", "e2ee"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-lib"

[install]
dir = ".vendor/.zed"

[dependencies]
"cliptown/cliptown-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --locked --all-targets --all-features"
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
  "**/target/**",
]

[targets.repository]
dir = "."

[targets.rust]
dir = "."
name = "cliptown-lib"
adapter = "rust"

[scripts]
test = "cargo test --locked --all-targets --all-features"
