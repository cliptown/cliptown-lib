name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cliptown-lib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Validate Cargo and Zed package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          cargo = tomllib.loads((root / 'Cargo.toml').read_text())
          cargo_lock = tomllib.loads((root / 'Cargo.lock').read_text())
          zed = tomllib.loads((root / '.zpkg.toml').read_text())
          zed_lock = tomllib.loads((root / '.zpkg.lock').read_text())

          assert cargo['package']['name'] == 'cliptown-lib'
          assert cargo['package']['edition'] == '2024'
          assert cargo['package']['rust-version'] == '1.88'
          assert cargo.get('dependencies', {}) == {}
          assert zed['package']['org'] == 'cliptown'
          assert zed['package']['name'] == 'cliptown-lib'
          assert zed['package']['version'] == cargo['package']['version']
          assert zed['package']['license'] == cargo['package']['license'] == 'MIT'
          assert zed['dependencies'] == {
              'cliptown/cliptown-interfaces': '^0.1.0',
          }
          assert zed['targets']['repository']['dir'] == '.'
          assert zed['targets']['rust'] == {'dir': '.', 'adapter': 'rust'}

          assert cargo_lock['version'] == 4
          assert any(
              package.get('name') == 'cliptown-lib'
              and package.get('version') == cargo['package']['version']
              for package in cargo_lock['package']
          )

          # Preserve and validate the resolver lock introduced by the concurrent
          # bootstrap. Version 1 permits the root package to be addressable before
          # the first external dependency resolution records concrete entries.
          assert zed_lock == {'version': 1}
          PY
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Verify package contents
        run: cargo package --allow-dirty --list

      - name: Reject credential-shaped tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|lin_api_[A-Za-z0-9]+|cfat_[A-Za-z0-9]+' -- ':!*.lock'; then
            echo 'credential-shaped tracked value found' >&2
            exit 1
          fi
