name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliptown-lib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Validate Cargo and Zed package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-package.py
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release library
        run: cargo build --locked --release --all-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Verify package contents
        run: cargo package --allow-dirty --list

      - name: Reject credential-shaped tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|lin_api_[A-Za-z0-9]+|cfat_[A-Za-z0-9]+' -- ':!*.lock'; then
            echo 'credential-shaped tracked value found' >&2
            exit 1
          fi

  zed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0

      - name: Check out canonical Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: 751358fe130e64b646844bc7d857c4cff215ca2d
          path: .zed-cli
          persist-credentials: false
          show-progress: false

      - name: Build pinned Zed CLI
        working-directory: .zed-cli
        run: cargo build --locked --release

      - name: Pack Zed package contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          .zed-cli/target/release/zed pack --out "$package_dir"
          mapfile -t archives < <(find "$package_dir" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          test -s "${archives[0]}"
          tar -tzf "${archives[0]}" >/tmp/cliptown-lib-zed-files.txt
          grep -Eq '(^|/)Cargo.toml$' /tmp/cliptown-lib-zed-files.txt
          grep -Eq '(^|/)src/lib.rs$' /tmp/cliptown-lib-zed-files.txt

      - name: Enforce resolver-owned lockfile
        run: |
          set -euo pipefail
          git diff --exit-code -- .zpkg.lock
          test "$(awk -F '=' '/^version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' .zpkg.lock)" = '1'
