name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cliptown-lib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.88.0 fmt --all --check
      - name: Lint
        run: cargo +1.88.0 clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.88.0 test --all-features --locked
