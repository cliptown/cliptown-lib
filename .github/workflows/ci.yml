name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Validate Zed package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          zed = tomllib.loads((root / '.zpkg.toml').read_text())
          cargo = tomllib.loads((root / 'Cargo.toml').read_text())

          assert zed['package']['org'] == 'cliptown'
          assert zed['package']['name'] == 'cliptown-lib'
          assert zed['package']['version'] == cargo['package']['version']
          assert zed['package']['license'] == cargo['package']['license'] == 'MIT'
          assert zed['dependencies'] == {
              'cliptown/cliptown-interfaces': '^0.1.0',
          }
          assert zed['targets']['rust']['dir'] == '.'
          assert zed['targets']['rust']['adapter'] == 'rust'
          assert not (root / '.zpkg.lock').exists(), (
              'Do not fabricate .zpkg.lock; generate it with the reviewed resolver.'
          )
          PY

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Verify package contents
        run: cargo package --allow-dirty --list

      - name: Reject credential-shaped tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|lin_api_[A-Za-z0-9]+|cfat_[A-Za-z0-9]+' -- ':!*.lock'; then
            echo 'credential-shaped tracked value found' >&2
            exit 1
          fi
