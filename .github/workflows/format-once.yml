name: One-shot Rust formatting

on:
  push:
    branches:
      - agent/den-3287-foundation

permissions:
  contents: write

concurrency:
  group: den-3287-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'cliptown/cliptown-lib'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3287-foundation
          persist-credentials: true
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply canonical formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/format-once.yml
          changed="$(git diff --name-only --cached; git diff --name-only)"
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == *.rs || "$path" == .github/workflows/format-once.yml ]] || {
              echo "unexpected formatter change: $path" >&2
              exit 1
            }
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'style(DEN-3287): apply canonical Rust formatting'
          git push origin HEAD:agent/den-3287-foundation
