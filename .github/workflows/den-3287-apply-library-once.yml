name: DEN-3287 semantic library integration

on:
  push:
    branches:
      - agent/den-3287-real-library
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-3287-semantic-library-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.repository == 'cliptown/cliptown-lib' &&
      github.ref == 'refs/heads/agent/den-3287-real-library'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3287-real-library
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify preserved parallel-agent domain core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/model.rs)" = d8a5cb992c486e021190920818948533daef2a1d
          test "$(git hash-object src/policy.rs)" = a57350504c146770de2e799d8003ba67014d8074
          test "$(git hash-object src/ports.rs)" = c072621e4de233418e3660bf80edbde782efaf24
          test "$(git hash-object docs/architecture.md)" = f02e67ea9f113c80eb223923e22ba1ad2848981b
          test "$(git hash-object LICENSE)" = 7470ae2ceb7f5b9e38b3c24a4a582de2be20e624
          test "$(git merge-base HEAD origin/main)" = 1f71cdc19f2a3ca941e49d0202dd91a91101d1e5

      - name: Validate and extract reviewed semantic overlay
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/tmp/den-3287-semantic-library.tar.gz.b64
          expected_payload_sha=864e9ac554dfa4503d15947f1f0d2e63066d69ffbe60adae6dddd8a15be1a5bc
          expected_archive_sha=3f126deac73b369af30e68a7ab113332cd2e9189616f4407959d95cbe47eb78c
          test -f "$payload"
          actual_payload_sha="$(sha256sum "$payload" | awk '{print $1}')"
          payload_bytes="$(wc -c < "$payload")"
          echo "SEALED_PAYLOAD bytes=${payload_bytes} sha256=${actual_payload_sha}"
          if [[ "$actual_payload_sha" != "$expected_payload_sha" ]]; then
            echo "sealed payload digest mismatch; expected ${expected_payload_sha}" >&2
            exit 1
          fi
          base64 -d "$payload" >/tmp/den-3287-cliptown-lib-overlay.tar.gz
          actual_archive_sha="$(sha256sum /tmp/den-3287-cliptown-lib-overlay.tar.gz | awk '{print $1}')"
          archive_bytes="$(wc -c < /tmp/den-3287-cliptown-lib-overlay.tar.gz)"
          echo "SEALED_ARCHIVE bytes=${archive_bytes} sha256=${actual_archive_sha}"
          if [[ "$actual_archive_sha" != "$expected_archive_sha" ]]; then
            echo "decoded archive digest mismatch; expected ${expected_archive_sha}" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          archive = Path('/tmp/den-3287-cliptown-lib-overlay.tar.gz')
          root = Path.cwd().resolve()
          expected = {
              'Cargo.toml',
              '.zpkg.toml',
              '.gitignore',
              'README.md',
              'SECURITY.md',
              'PROVENANCE.md',
              'src/lib.rs',
              'src/error.rs',
              'src/api.rs',
              'src/contract.rs',
              'src/convergence.rs',
              'src/crypto.rs',
              'src/search.rs',
              'scripts/check-package.py',
              '.github/workflows/ci.yml',
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              print('SEALED_MEMBERS ' + ','.join(sorted(names)))
              if names != expected or len(members) != len(expected):
                  raise SystemExit(f'unexpected overlay members: {sorted(names)}')
              for member in members:
                  name = PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts or not member.isfile():
                      raise SystemExit(f'unsafe overlay member: {member.name}')
                  destination = (root / Path(*name.parts)).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f'overlay path escapes repository: {member.name}')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'missing overlay bytes: {member.name}')
                  destination.write_bytes(source.read())
                  os.chmod(destination, member.mode & 0o777)
          print('SEALED_EXTRACTION_OK')
          PY
          rm -f /tmp/den-3287-cliptown-lib-overlay.tar.gz

      - name: Remove only the known placeholder Zed lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .zpkg.lock ]]; then
            normalized="$(tr -d '[:space:]' < .zpkg.lock)"
            if [[ "$normalized" != version=1 ]]; then
              echo 'Refusing to remove a non-placeholder .zpkg.lock' >&2
              exit 1
            fi
            rm .zpkg.lock
          fi

      - name: Re-verify preserved domain ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/model.rs)" = d8a5cb992c486e021190920818948533daef2a1d
          test "$(git hash-object src/policy.rs)" = a57350504c146770de2e799d8003ba67014d8074
          test "$(git hash-object src/ports.rs)" = c072621e4de233418e3660bf80edbde782efaf24
          test "$(git hash-object docs/architecture.md)" = f02e67ea9f113c80eb223923e22ba1ad2848981b
          test "$(git hash-object LICENSE)" = 7470ae2ceb7f5b9e38b3c24a4a582de2be20e624

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Generate locks, normalize, and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          python3 scripts/check-package.py
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
          cargo package --locked --allow-dirty

      - name: Remove one-shot payload and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp/den-3287-semantic-library.tar.gz.b64
          rm .github/workflows/den-3287-apply-library-once.yml
          rmdir .github/tmp 2>/dev/null || true

      - name: Commit semantic integration without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(DEN-3287): integrate canonical interfaces and shared policy'
          git push origin HEAD:agent/den-3287-real-library
