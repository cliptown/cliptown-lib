name: Format DEN-3287 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-den-3287-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-den-3287-once
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'cliptown/cliptown-lib' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Apply and bound canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          expected="$RUNNER_TEMP/expected-files"
          actual="$RUNNER_TEMP/actual-files"
          printf '%s\n' \
            src/delegation.rs \
            src/lib.rs \
            src/policy.rs \
            src/ports.rs \
            | sort > "$expected"
          git diff --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --check

      - name: Commit formatting and retire this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-den-3287-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply canonical Rust 1.88 formatting'
          git push origin HEAD:refs/heads/main
