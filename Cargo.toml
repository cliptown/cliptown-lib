[package]
name = "cliptown-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-lib"
description = "Shared domain and application primitives for ClipTown"
keywords = ["clipboard", "e2ee", "authorization", "sync"]
categories = ["authentication", "data-structures"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
