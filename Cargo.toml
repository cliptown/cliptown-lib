[package]
name = "cliptown-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shared Rust domain library and policy core for ClipTown"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-lib"
readme = "README.md"
keywords = ["clipboard", "sync", "encryption", "e2ee"]
categories = ["cryptography", "data-structures"]
publish = false

[lib]
name = "cliptown_lib"
path = "src/lib.rs"

[features]
default = []

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
